[package]
name = "budget-app"
version = "0.1.0"
description = "Local budget tracker"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "budget_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-persisted-scope = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
